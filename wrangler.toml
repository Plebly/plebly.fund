name = "plebly-fund"
compatibility_date = "2026-03-01"
workers_dev = true

routes = [
  { pattern = "plebly.fund", zone_name = "plebly.fund" },
  { pattern = "plebly.fund/*", zone_name = "plebly.fund" },
  { pattern = "www.plebly.fund", zone_name = "plebly.fund" },
  { pattern = "www.plebly.fund/*", zone_name = "plebly.fund" },
]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# main → wrangler deploy --env signet (after the apex deploy)
# main keeps unnamed apex routes until the cutover commit that moves them
# into [env.production] and switches the workflow to --env production.
[env.signet]
name = "plebly-fund-signet"
workers_dev = true
routes = [
  { pattern = "signet.plebly.fund", zone_name = "plebly.fund" },
  { pattern = "signet.plebly.fund/*", zone_name = "plebly.fund" },
]
