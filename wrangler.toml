name = "plebly-fund"
compatibility_date = "2026-03-01"
workers_dev = true

routes = [
  { pattern = "plebly.fund", zone_name = "plebly.fund" },
  { pattern = "plebly.fund/*", zone_name = "plebly.fund" },
  { pattern = "www.plebly.fund", zone_name = "plebly.fund" },
  { pattern = "www.plebly.fund/*", zone_name = "plebly.fund" },
]

[assets]
directory = "./dist"
# Unknown paths serve dist/404.html with HTTP 404. Known SPA routes are
# materialized as dist/<route>/index.html by scripts/spa-fallback.mjs so they
# stay 200. Dynamic routes (/p/*, /u/*, /proposal/*, /org/*, /admin/*) use the
# 404.html shell (same as GitHub Pages) and the client router renders them.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# main → wrangler deploy --env signet (after the apex deploy)
# main keeps unnamed apex routes until the cutover commit that moves them
# into [env.production] and switches the workflow to --env production.
[env.signet]
name = "plebly-fund-signet"
workers_dev = true
routes = [
  { pattern = "signet.plebly.fund", zone_name = "plebly.fund" },
  { pattern = "signet.plebly.fund/*", zone_name = "plebly.fund" },
]
