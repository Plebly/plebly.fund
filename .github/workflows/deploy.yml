name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded deploys so a stuck queue does not burn the timeout.
concurrency:
  group: deploy-plebly-fund-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: plebly
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # generated/*.ts is gitignored — must generate before test/build.
      # Bake network/API in the job. Do not read repo vars.VITE_* (they would
      # flip both sites).
      - name: Test (develop / signet)
        if: github.ref == 'refs/heads/develop'
        run: npm test
        env:
          VITE_BITCOIN_NETWORK: signet
      - name: Build (develop / signet)
        if: github.ref == 'refs/heads/develop'
        run: npm run build
        env:
          VITE_WORKERS_API: https://api.signet.plebly.fund
          VITE_BITCOIN_NETWORK: signet
          VITE_BASE_PATH: /
      - name: Deploy signet.plebly.fund
        if: github.ref == 'refs/heads/develop'
        run: npx wrangler deploy --env signet

      - name: Test (main / apex, still signet until cutover)
        if: github.ref == 'refs/heads/main'
        run: npm test
        env:
          VITE_BITCOIN_NETWORK: signet
      - name: Build (main / apex, still signet until cutover)
        if: github.ref == 'refs/heads/main'
        run: npm run build
        env:
          VITE_WORKERS_API: https://api.plebly.fund
          VITE_BITCOIN_NETWORK: signet
          VITE_BASE_PATH: /
      # Cutover: switch this job to VITE_BITCOIN_NETWORK=mainnet,
      # VITE_WORKERS_API=https://api.plebly.fund, VITE_LIGHTNING=0, and
      # `npx wrangler deploy --env production` in the same commit that moves
      # apex routes into [env.production].
      - name: Deploy apex (unnamed env)
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
