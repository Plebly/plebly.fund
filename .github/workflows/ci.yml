name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: plebly
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          VITE_BITCOIN_NETWORK: signet
      - run: npm run build
        env:
          VITE_WORKERS_API: https://api.signet.plebly.fund
          VITE_BITCOIN_NETWORK: signet
          VITE_BASE_PATH: /

  # Donate / claim-chrome smoke (Playwright). Blocks merge when #donate-modal
  # does not open on click — intentional until Donate is fixed on the target URL.
  # Hits the signet rehearsal site so CI never exercises live mainnet money.
  e2e:
    runs-on: plebly
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Donate modal smoke
        run: npm run test:e2e
        env:
          PLEBLY_BASE_URL: https://signet.plebly.fund
