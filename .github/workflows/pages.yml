name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded deploys so a stuck queue does not burn the timeout.
concurrency:
  group: deploy-plebly-fund
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, plebly]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_WORKERS_API: ${{ vars.VITE_WORKERS_API || 'https://plebly-api.securesovereigns.workers.dev' }}
          VITE_BITCOIN_NETWORK: ${{ vars.VITE_BITCOIN_NETWORK || 'signet' }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
      # Live apex is Cloudflare Workers assets (wrangler.toml routes), not GitHub Pages.
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
